name: GitHub Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest
      - name: Build source release archive
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          zip -r "dist/trump-event-monitor-${VERSION}.zip" . \
            -x '.git/*' 'dist/*' '*__pycache__/*' '.pytest_cache/*' 'output/*' '*.pyc' '*.pyo'
          sha256sum "dist/trump-event-monitor-${VERSION}.zip" > "dist/SHA256SUMS.txt"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
